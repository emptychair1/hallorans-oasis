<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Piper Viseme Lab 01</title><style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#f4eee7;font:15px system-ui,sans-serif}main{max-width:700px;margin:auto;padding:16px}h1{font-size:22px;margin:0 0 8px}p{color:#c7bcb4}.stage{position:relative;width:100%;touch-action:none;user-select:none;background:#080808;overflow:hidden}.stage{aspect-ratio:1/1}.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.stage img{position:absolute;display:block;max-width:none;pointer-events:none}.stage svg{position:relative;display:block;width:100%;height:100%;touch-action:none}.hit{fill:transparent;pointer-events:all;cursor:grab}.stage text{pointer-events:none}.point{fill:#ffd08b;stroke:#20140a;stroke-width:1.4;cursor:grab}.line{fill:none;stroke:#ffd08b;stroke-width:1.1;stroke-dasharray:3 2}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{background:#28252b;color:white;border:1px solid #78675d;border-radius:8px;padding:10px}button[aria-pressed="true"]{background:#69503a;border-color:#ffd08b}button:focus-visible{outline:2px solid white}pre{white-space:pre-wrap;word-break:break-word;background:#211f23;padding:12px;border-radius:8px;font-size:12px}small{color:#b8aca3}label{display:flex;justify-content:space-between;width:100%;font-weight:600}
</style></head><body><main><h1>Piper Viseme Lab · Bite 01</h1><p>Viseme audition: REST, AH, EE, OO. Experimental shapes based on the approved Bite 06 portrait. Mouth Lab remains untouched.</p><div id="stage" class="stage"><img id="portrait" alt="Piper original portrait"><canvas id="warp" aria-hidden="true"></canvas><svg id="overlay" aria-label="Zoomed portrait with draggable lip landmarks"></svg></div><div class="controls"><button data-viseme="rest" aria-pressed="true">REST</button><button data-viseme="ah" aria-pressed="false">AH</button><button data-viseme="ee" aria-pressed="false">EE</button><button data-viseme="oo" aria-pressed="false">OO</button><label for="opening">Mouth opening <output id="openingValue">0%</output></label><input id="opening" type="range" min="0" max="100" value="0" step="1" style="width:100%;accent-color:#ffd08b"><button id="toggleMarkers">Show markers</button><button id="zoomOut">− Zoom</button><button id="zoomIn">+ Zoom</button><button id="reset">Reset points</button><button id="copy">Copy landmarks</button><button id="download">Download JSON</button></div><small>Coordinates are normalized from 0 to 1, so they survive different screen sizes. Adjust markers, then export your measurements.</small><pre id="output"></pre></main><script type="module" src="/src/viseme-lab.ts"></script></body></html>
